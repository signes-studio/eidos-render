<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Piece 01 — Lamas Mid-Reveal | Eidos Render</title>
  <link rel="stylesheet" href="../../assets/fonts.css">
  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      background-color: var(--charcoal);
      color: var(--cream);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: var(--font-text);
    }

    .test-header {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line-dark);
      background-color: var(--charcoal-2);
      position: relative;
      z-index: 100;
    }

    .motion-lamas-stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 80px);
      overflow: hidden;
      background-color: var(--charcoal);
    }

    .stage-underlay {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .stage-underlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stage-hero-content {
      position: absolute;
      bottom: 80px;
      left: 60px;
      z-index: 3;
      max-width: 800px;
      pointer-events: none;
    }

    .stage-hero-content h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      line-height: 0.95;
      text-transform: uppercase;
      margin: 0 0 20px 0;
      color: var(--cream);
    }

    .stage-hero-content p {
      font-size: 1.15rem;
      color: rgba(239, 233, 220, 0.85);
      margin: 0;
      max-width: 580px;
    }

    .brise-soleil-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      pointer-events: none;
    }

    .lama-col {
      flex: 1;
      height: 100%;
      position: relative;
      transform-origin: left center;
      background-color: var(--charcoal);
      border-right: 1px solid rgba(239, 233, 220, 0.12);
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .lama-col.lama-datum {
      border-right: 1.5px solid var(--accent);
    }
  </style>
</head>
<body>

  <header class="test-header">
    <div style="font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.1em; text-transform: uppercase;">
      <span style="color: var(--accent); font-weight: 700;">01</span>
      <span>Motion Graphics: Lamas (Brise-Soleil) — Fotograma Medio de Apertura</span>
    </div>
  </header>

  <main class="motion-lamas-stage">
    
    <div class="stage-underlay">
      <img src="../../img/render-fachada-edificio-obra-nueva-1600.jpg" alt="Render">
      <div style="position: absolute; inset: 0; background: rgba(30, 28, 26, 0.4);"></div>
    </div>

    <!-- Lamas con escala decreciente progresiva (revelado de izquierda a derecha) -->
    <div class="brise-soleil-overlay" aria-hidden="true">
      <div class="lama-col" style="transform: scaleX(0);"></div>
      <div class="lama-col" style="transform: scaleX(0.05);"></div>
      <div class="lama-col" style="transform: scaleX(0.12);"></div>
      <div class="lama-col lama-datum" style="transform: scaleX(0.22);"></div>
      <div class="lama-col" style="transform: scaleX(0.35);"></div>
      <div class="lama-col" style="transform: scaleX(0.50);"></div>
      <div class="lama-col" style="transform: scaleX(0.65);"></div>
      <div class="lama-col" style="transform: scaleX(0.78);"></div>
      <div class="lama-col" style="transform: scaleX(0.88);"></div>
      <div class="lama-col" style="transform: scaleX(0.95);"></div>
      <div class="lama-col lama-datum" style="transform: scaleX(1);"></div>
      <div class="lama-col" style="transform: scaleX(1);"></div>
      <div class="lama-col" style="transform: scaleX(1);"></div>
      <div class="lama-col" style="transform: scaleX(1);"></div>
      <div class="lama-col" style="transform: scaleX(1);"></div>
      <div class="lama-col" style="transform: scaleX(1);"></div>
    </div>

    <div class="stage-hero-content">
      <span class="kicker" style="color: var(--accent-on-dark); letter-spacing: 0.22em; margin-bottom: 12px; display: block;">
        DIRECCIÓN VISUAL DE ARQUITECTURA
      </span>
      <h1>DEL PROYECTO<br>AL LANZAMIENTO.</h1>
      <p>Partimos de la arquitectura. Construimos su imagen. Y la llevamos hasta el mercado con precisión editorial.</p>
    </div>

  </main>

</body>
</html>
