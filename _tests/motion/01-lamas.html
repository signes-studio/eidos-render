<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Piece 01 — Lamas (Brise-Soleil) | Eidos Render</title>
  <link rel="stylesheet" href="../../assets/fonts.css">
  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      background-color: var(--charcoal);
      color: var(--cream);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: var(--font-text);
    }

    .test-header {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line-dark);
      background-color: var(--charcoal-2);
      position: relative;
      z-index: 100;
    }

    .test-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .test-controls {
      display: flex;
      gap: 12px;
    }

    .btn-test {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 18px;
      border: 1px solid var(--line-dark);
      background: transparent;
      color: var(--cream);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-test:hover, .btn-test.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--cream);
    }

    /* ==========================================================================
       COMPONENTE: LAMAS BRISE-SOLEIL (Motion Graphic 01)
       ========================================================================== */
    .motion-lamas-stage {
      position: relative;
      width: 100%;
      height: calc(100vh - 80px);
      overflow: hidden;
      background-color: var(--charcoal);
    }

    /* Imagen o render de fondo que se descubre tras las lamas */
    .stage-underlay {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .stage-underlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stage-hero-content {
      position: absolute;
      bottom: 80px;
      left: 60px;
      z-index: 3;
      max-width: 800px;
      pointer-events: none;
    }

    .stage-hero-content h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      line-height: 0.95;
      text-transform: uppercase;
      margin: 0 0 20px 0;
      color: var(--cream);
    }

    .stage-hero-content p {
      font-size: 1.15rem;
      color: rgba(239, 233, 220, 0.85);
      margin: 0;
      max-width: 580px;
    }

    /* Contenedor del telón de lamas */
    .brise-soleil-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      pointer-events: none;
    }

    .lama-col {
      flex: 1;
      height: 100%;
      position: relative;
      transform-origin: left center;
      background-color: var(--charcoal);
      /* Borde derecho de cada lama simulando la arista constructiva */
      border-right: 1px solid rgba(239, 233, 220, 0.08);
      will-change: transform;
    }

    /* Una lama singular con cota en frambuesa */
    .lama-col.lama-datum {
      border-right: 1px solid var(--accent);
    }

    /* Sombra proyectada dura de la lama sobre la adyacente */
    .lama-col::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 12px;
      background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.35));
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s;
    }

    /* Estado estático para prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .lama-col {
        transform: scaleX(0) !important;
      }
    }
  </style>
</head>
<body>

  <header class="test-header">
    <div class="test-title">
      <span style="color: var(--accent); font-weight: 700;">01</span>
      <span>Motion Graphics: Lamas (Brise-Soleil)</span>
    </div>

    <div class="test-controls">
      <button class="btn-test" id="btn-open">Abrir Lamas (Hero Reveal)</button>
      <button class="btn-test" id="btn-close">Cerrar Lamas (Transición)</button>
      <button class="btn-test" id="btn-mid">Fotograma 50%</button>
      <button class="btn-test" id="btn-closed">Fotograma Cerrado (100%)</button>
    </div>
  </header>

  <main class="motion-lamas-stage" id="stage">
    
    <!-- Render arquitectónico detrás de las lamas -->
    <div class="stage-underlay">
      <img src="../../img/render-fachada-edificio-obra-nueva-1600.jpg" alt="Render Arquitectónico">
      <div style="position: absolute; inset: 0; background: rgba(30, 28, 26, 0.4);"></div>
    </div>

    <!-- Telón de 16 lamas arquitectónicas -->
    <div class="brise-soleil-overlay" id="brise-soleil" aria-hidden="true">
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col lama-datum"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col lama-datum"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
      <div class="lama-col"></div>
    </div>

    <div class="stage-hero-content">
      <span class="kicker" style="color: var(--accent-on-dark); letter-spacing: 0.22em; margin-bottom: 12px; display: block;">
        DIRECCIÓN VISUAL DE ARQUITECTURA
      </span>
      <h1>DEL PROYECTO<br>AL LANZAMIENTO.</h1>
      <p>Partimos de la arquitectura. Construimos su imagen. Y la llevamos hasta el mercado con precisión editorial.</p>
    </div>

  </main>

  <script src="../../assets/vendor/gsap.min.js"></script>
  <script>
    const lamas = document.querySelectorAll('.lama-col');
    let currentTl = null;

    // 1. Abrir lamas (revelar render)
    function openLamas(duration = 1.35) {
      if (currentTl) currentTl.kill();
      // Ensure starting from closed
      gsap.set(lamas, { scaleX: 1, transformOrigin: 'left center' });
      
      currentTl = gsap.to(lamas, {
        scaleX: 0,
        duration: duration,
        stagger: {
          each: 0.045,
          from: 'start'
        },
        ease: 'expo.out'
      });
      return currentTl;
    }

    // 2. Cerrar lamas (cubrir para transición)
    function closeLamas(duration = 1.1) {
      if (currentTl) currentTl.kill();
      gsap.set(lamas, { scaleX: 0, transformOrigin: 'right center' });

      currentTl = gsap.to(lamas, {
        scaleX: 1,
        duration: duration,
        stagger: {
          each: 0.035,
          from: 'start'
        },
        ease: 'expo.out'
      });
      return currentTl;
    }

    // 3. Fotograma fijo al 50%
    function setMid() {
      if (currentTl) currentTl.kill();
      lamas.forEach((lama, i) => {
        // Simular apertura en progreso gradual
        const progress = Math.max(0, Math.min(1, (i - 3) / 10));
        gsap.set(lama, { scaleX: progress, transformOrigin: 'left center' });
      });
    }

    // 4. Fotograma cerrado (100%)
    function setClosed() {
      if (currentTl) currentTl.kill();
      gsap.set(lamas, { scaleX: 1, transformOrigin: 'left center' });
    }

    document.getElementById('btn-open').addEventListener('click', () => openLamas());
    document.getElementById('btn-close').addEventListener('click', () => closeLamas());
    document.getElementById('btn-mid').addEventListener('click', setMid);
    document.getElementById('btn-closed').addEventListener('click', setClosed);

    // Auto-revelado inicial al cargar
    window.addEventListener('DOMContentLoaded', () => {
      openLamas();
    });

    // Soporte para capturas automatizadas vía URL (?state=mid, ?state=closed, ?state=open)
    const params = new URLSearchParams(window.location.search);
    if (params.get('state') === 'mid') {
      setMid();
    } else if (params.get('state') === 'closed') {
      setClosed();
    }
  </script>
</body>
</html>
