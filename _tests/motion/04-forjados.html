<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Piece 04 — Forjados (Capas que se apilan) | Eidos Render</title>
  <link rel="stylesheet" href="../../assets/fonts.css">
  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      background-color: var(--charcoal);
      color: var(--cream);
      margin: 0;
      padding: 0;
      font-family: var(--font-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .test-header {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line-dark);
      background-color: var(--charcoal-2);
      position: relative;
      z-index: 100;
    }

    .test-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .test-controls {
      display: flex;
      gap: 12px;
    }

    .btn-test {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 18px;
      border: 1px solid var(--line-dark);
      background: transparent;
      color: var(--cream);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-test:hover, .btn-test.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--cream);
    }

    .stage-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      background: radial-gradient(circle at center, var(--charcoal-2) 0%, var(--charcoal) 70%);
      position: relative;
    }

    /* ==========================================================================
       COMPONENTE: FORJADOS (Motion Graphic 04)
       ========================================================================== */
    .forjados-widget {
      width: 100%;
      max-width: 640px;
      background: var(--charcoal);
      border: 1px solid var(--line-dark);
      padding: 60px 50px;
      position: relative;
    }

    .forjados-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line-dark);
      padding-bottom: 20px;
      margin-bottom: 48px;
    }

    .forjados-meta-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
      color: var(--cream);
    }

    .forjados-meta-code {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--stone);
      text-transform: uppercase;
    }

    /* Retícula arquitectónica de forjados */
    .forjados-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      padding-left: 48px;
    }

    /* Línea vertical de plomada / eje estructural */
    .forjados-stack::before {
      content: '';
      position: absolute;
      left: 16px;
      top: -10px;
      bottom: -10px;
      width: 1px;
      background-color: var(--line-dark);
    }

    .forjado-row {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    /* Indicador numérico de planta */
    .forjado-level {
      font-family: var(--font-display);
      font-size: 0.75rem;
      color: var(--stone);
      width: 24px;
      text-align: right;
      letter-spacing: 0.05em;
    }

    /* Barra o losa del forjado */
    .forjado-slab {
      height: 6px;
      background-color: var(--cream);
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
      position: relative;
    }

    /* Slab con cota especial de marca en Frambuesa */
    .forjado-row.is-datum .forjado-slab {
      height: 8px;
      background-color: var(--accent);
    }

    .forjado-row.is-datum .forjado-level {
      color: var(--accent-on-dark);
      font-weight: 700;
    }

    /* Tag de descripción arquitectónica */
    .forjado-tag {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stone);
      opacity: 0;
      transform: translateX(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }

    .forjado-row.is-datum .forjado-tag {
      color: var(--cream);
    }

    /* =====================================================
       VERSIÓN EN PRELOADER COMPACTO (variante secundaria)
       ===================================================== */
    .forjados-compact {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid var(--line-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forjados-compact-title {
      font-family: var(--font-display);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--stone);
    }

    .forjados-icon {
      width: 48px;
      height: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .forjados-icon-bar {
      height: 3px;
      background-color: var(--cream);
      transform-origin: left center;
      transform: scaleX(0);
    }

    .forjados-icon-bar:nth-child(1) { width: 100%; }
    .forjados-icon-bar:nth-child(2) { width: 75%; background-color: var(--accent); }
    .forjados-icon-bar:nth-child(3) { width: 90%; }
    .forjados-icon-bar:nth-child(4) { width: 55%; }

    @media (prefers-reduced-motion: reduce) {
      .forjado-slab, .forjados-icon-bar {
        transform: scaleX(1) !important;
      }
      .forjado-tag {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <header class="test-header">
    <div class="test-title">
      <span style="color: var(--accent); font-weight: 700;">04</span>
      <span>Motion Graphics: Forjados (Capas que se apilan)</span>
    </div>

    <div class="test-controls">
      <button class="btn-test" id="btn-stack">Apilar Forjados</button>
      <button class="btn-test" id="btn-unstack">Deshacer</button>
      <button class="btn-test" id="btn-mid">Fotograma 50%</button>
      <button class="btn-test" id="btn-completed">Fotograma Completo (100%)</button>
    </div>
  </header>

  <main class="stage-container">
    
    <div class="forjados-widget">
      
      <div class="forjados-meta">
        <h2 class="forjados-meta-title">Estructura & Forjados</h2>
        <span class="forjados-meta-code">Secuencia Tectónica · 04 Niveles</span>
      </div>

      <div class="forjados-stack" id="stack">
        
        <!-- Nivel 04 (Ático) -->
        <div class="forjado-row" data-width="50%">
          <span class="forjado-level">N4</span>
          <div class="forjado-slab" style="width: 50%;"></div>
          <span class="forjado-tag">Ático & Cubierta</span>
        </div>

        <!-- Nivel 03 -->
        <div class="forjado-row" data-width="72%">
          <span class="forjado-level">N3</span>
          <div class="forjado-slab" style="width: 72%;"></div>
          <span class="forjado-tag">Planta Alta</span>
        </div>

        <!-- Nivel 02 (Datum en Frambuesa) -->
        <div class="forjado-row is-datum" data-width="100%">
          <span class="forjado-level">N2</span>
          <div class="forjado-slab" style="width: 100%;"></div>
          <span class="forjado-tag">Cota Principal (Datum)</span>
        </div>

        <!-- Nivel 01 -->
        <div class="forjado-row" data-width="84%">
          <span class="forjado-level">N1</span>
          <div class="forjado-slab" style="width: 84%;"></div>
          <span class="forjado-tag">Planta Baja</span>
        </div>

        <!-- Nivel 00 (Cimentación) -->
        <div class="forjado-row" data-width="60%">
          <span class="forjado-level">N0</span>
          <div class="forjado-slab" style="width: 60%;"></div>
          <span class="forjado-tag">Cimentación & Rasante</span>
        </div>

      </div>

      <!-- Variante Compacta para Preloader o Badges -->
      <div class="forjados-compact">
        <span class="forjados-compact-title">Módulo Preloader Micro-Isotipo</span>
        <div class="forjados-icon" id="compact-icon">
          <div class="forjados-icon-bar"></div>
          <div class="forjados-icon-bar"></div>
          <div class="forjados-icon-bar"></div>
          <div class="forjados-icon-bar"></div>
        </div>
      </div>

    </div>

  </main>

  <script src="../../assets/vendor/gsap.min.js"></script>
  <script>
    const rows = Array.from(document.querySelectorAll('.forjado-row'));
    // Orden de construcción: desde abajo (N0) hacia arriba (N4)
    const reversedRows = rows.slice().reverse();
    const slabs = reversedRows.map(r => r.querySelector('.forjado-slab'));
    const tags = reversedRows.map(r => r.querySelector('.forjado-tag'));
    const compactBars = document.querySelectorAll('.forjados-icon-bar');

    let currentTl = null;

    // 1. Apilar forjados desde abajo
    function stackForjados() {
      if (currentTl) currentTl.kill();
      gsap.set(slabs, { scaleX: 0 });
      gsap.set(tags, { opacity: 0, x: 10 });
      gsap.set(compactBars, { scaleX: 0 });

      currentTl = gsap.timeline();

      // Animación de losas principales
      currentTl.to(slabs, {
        scaleX: 1,
        duration: 1.1,
        stagger: 0.12,
        ease: 'expo.out'
      }, 0);

      // Etiquetas descriptivas
      currentTl.to(tags, {
        opacity: 1,
        x: 0,
        duration: 0.6,
        stagger: 0.12,
        ease: 'power2.out'
      }, 0.2);

      // Barras compactas
      currentTl.to(compactBars, {
        scaleX: 1,
        duration: 0.8,
        stagger: 0.08,
        ease: 'expo.out'
      }, 0.3);

      return currentTl;
    }

    // 2. Deshacer forjados
    function unstackForjados() {
      if (currentTl) currentTl.kill();
      currentTl = gsap.timeline();

      currentTl.to(tags, {
        opacity: 0,
        x: 10,
        duration: 0.4,
        stagger: 0.05,
        ease: 'power2.in'
      }, 0);

      currentTl.to(slabs, {
        scaleX: 0,
        duration: 0.8,
        stagger: 0.06,
        ease: 'expo.in'
      }, 0.1);

      currentTl.to(compactBars, {
        scaleX: 0,
        duration: 0.5,
        stagger: 0.04,
        ease: 'expo.in'
      }, 0.1);

      return currentTl;
    }

    // 3. Fotograma al 50%
    function setMid() {
      if (currentTl) currentTl.kill();
      slabs.forEach((slab, i) => {
        // Los niveles inferiores ya construidos, los superiores a medio construir o en 0
        const progress = Math.max(0, Math.min(1, (3 - i) / 2));
        gsap.set(slab, { scaleX: progress });
      });
      tags.forEach((tag, i) => {
        gsap.set(tag, { opacity: i <= 2 ? 1 : 0, x: i <= 2 ? 0 : 10 });
      });
      compactBars.forEach((bar, i) => {
        gsap.set(bar, { scaleX: i < 2 ? 1 : (i === 2 ? 0.5 : 0) });
      });
    }

    // 4. Fotograma completo al 100%
    function setCompleted() {
      if (currentTl) currentTl.kill();
      gsap.set(slabs, { scaleX: 1 });
      gsap.set(tags, { opacity: 1, x: 0 });
      gsap.set(compactBars, { scaleX: 1 });
    }

    document.getElementById('btn-stack').addEventListener('click', stackForjados);
    document.getElementById('btn-unstack').addEventListener('click', unstackForjados);
    document.getElementById('btn-mid').addEventListener('click', setMid);
    document.getElementById('btn-completed').addEventListener('click', setCompleted);

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      stackForjados();
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('state') === 'mid') {
      setMid();
    } else if (params.get('state') === 'completed') {
      setCompleted();
    }
  </script>
</body>
</html>
